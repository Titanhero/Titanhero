<svg width="100%" height="48" viewBox="0 0 1000 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0F172A; }
    .text-mono {
      font-family: 'JetBrains Mono', monospace, Consolas;
      font-size: 11px;
      font-weight: 500;
    }
    .text-inter {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11.5px;
      font-weight: 400;
    }
    .pulse {
      animation: blink 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- Kart Çerçevesi -->
  <rect width="1000" height="48" rx="6" class="bg" stroke="#1E293B" stroke-width="1" />

  <!-- Canlı Durum Sinyali -->
  <circle cx="36" cy="24" r="4" fill="#06B6D4" class="pulse" />
  <text x="52" y="28" fill="#06B6D4" class="text-mono">SYSTEM: ACTIVE</text>

  <text x="210" y="28" fill="#334155" class="text-mono">|</text>

  <!-- Merkez Modüller -->
  <text x="235" y="28" fill="#64748B" class="text-mono">CORE:</text>
  <text x="280" y="28" fill="#FFFFFF" class="text-inter">LegalTech Türkiye LAB</text>

  <text x="450" y="28" fill="#334155" class="text-mono">|</text>

  <text x="475" y="28" fill="#64748B" class="text-mono">PIPELINE:</text>
  <text x="545" y="28" fill="#FFFFFF" class="text-inter">LTL Gündemi</text>

  <text x="650" y="28" fill="#334155" class="text-mono">|</text>

  <text x="675" y="28" fill="#64748B" class="text-mono">MEMORY:</text>
  <text x="735" y="28" fill="#FFFFFF" class="text-inter">Hermes System</text>

  <!-- Sağ Uç Rozet (Legal Gold) -->
  <rect x="880" y="14" width="90" height="20" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="925" y="28" text-anchor="middle" fill="#F59E0B" class="text-mono" font-size="10">AUTONOMOUS</text>
</svg>
