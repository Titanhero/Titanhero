<svg width="100%" height="84" viewBox="0 0 1000 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0F172A; }
    .track { stroke: #1E293B; stroke-width: 1.5; }
    .signal {
      stroke: #06B6D4;
      stroke-width: 1.5;
      stroke-dasharray: 80 400;
      animation: signalFlow 5s linear infinite;
    }
    .node-base { fill: #0F172A; stroke: #334155; stroke-width: 1.5; }
    .node-cyan { fill: #06B6D4; }
    .node-gold { fill: #F59E0B; }
    .text-mono {
      font-family: 'JetBrains Mono', monospace, Consolas;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    @keyframes signalFlow {
      0% { stroke-dashoffset: 480; }
      100% { stroke-dashoffset: 0; }
    }
    .pulse-cyan {
      animation: pulseCyan 2.5s ease-in-out infinite alternate;
    }
    @keyframes pulseCyan {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Deep Space Blue Zemin & Kenarlık -->
  <rect width="1000" height="84" rx="6" class="bg" stroke="#1E293B" stroke-width="1" />

  <!-- Sabit İletim Yolu -->
  <path d="M 60 42 L 280 42 L 340 42 L 560 42 L 620 42 L 940 42" class="track" />

  <!-- Canlı Electric Cyan Sinyal Akışı -->
  <path d="M 60 42 L 940 42" class="signal" />

  <!-- Düğüm 1: Raw Input / Case -->
  <circle cx="120" cy="42" r="5" class="node-base" />
  <circle cx="120" cy="42" r="2.5" class="node-cyan pulse-cyan" />
  <text x="120" y="64" text-anchor="middle" fill="#64748B" class="text-mono">LEGAL_INPUT</text>

  <!-- Düğüm 2: Agent Logic (ACP) -->
  <circle cx="380" cy="42" r="5" class="node-base" />
  <circle cx="380" cy="42" r="2.5" class="node-cyan" />
  <text x="380" y="25" text-anchor="middle" fill="#06B6D4" class="text-mono">AGENTIC_WORKFLOW</text>

  <!-- Düğüm 3: Hermes Memory Palace -->
  <circle cx="640" cy="42" r="5" class="node-base" />
  <circle cx="640" cy="42" r="2.5" class="node-cyan pulse-cyan" />
  <text x="640" y="64" text-anchor="middle" fill="#64748B" class="text-mono">HERMES_MEMORY</text>

  <!-- Düğüm 4: Verified Execution (Legal Gold Aksanı) -->
  <circle cx="880" cy="42" r="6" stroke="#F59E0B" stroke-width="1.5" fill="#0F172A" />
  <circle cx="880" cy="42" r="2.5" class="node-gold" />
  <text x="880" y="25" text-anchor="middle" fill="#F59E0B" class="text-mono">SYSTEM_OUTPUT</text>
</svg>
